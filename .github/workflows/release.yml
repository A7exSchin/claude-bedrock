name: Release

on:
  push:
    branches:
      - main
    paths:
      - "pi/package.json"
      - "claude-code/.claude-plugin/plugin.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version (both sides move together - see README's Versioning section)
        id: version
        run: |
          PI_VERSION=$(jq -r .version pi/package.json)
          CC_VERSION=$(jq -r .version claude-code/.claude-plugin/plugin.json)
          if [ "$PI_VERSION" != "$CC_VERSION" ]; then
            echo "::error::pi/package.json ($PI_VERSION) and claude-code/.claude-plugin/plugin.json ($CC_VERSION) versions disagree"
            exit 1
          fi
          echo "version=$PI_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$PI_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
