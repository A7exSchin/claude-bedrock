name: Release

on:
  push:
    branches:
      - main
    paths:
      - "pi/package.json"
      - "claude-code/.claude-plugin/plugin.json"
  # Lets a release be (re-)created for the current version without needing a new
  # commit - e.g. to backfill one after a tag got pushed manually, bypassing this
  # pipeline, and the release never got created.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version (both sides move together - see README's Versioning section)
        id: version
        run: |
          PI_VERSION=$(jq -r .version pi/package.json)
          CC_VERSION=$(jq -r .version claude-code/.claude-plugin/plugin.json)
          if [ "$PI_VERSION" != "$CC_VERSION" ]; then
            echo "::error::pi/package.json ($PI_VERSION) and claude-code/.claude-plugin/plugin.json ($CC_VERSION) versions disagree"
            exit 1
          fi
          echo "version=$PI_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$PI_VERSION" >> "$GITHUB_OUTPUT"

      # Checks whether a *release* exists, not just a tag - a tag can exist without
      # a release (e.g. pushed by hand), and that's exactly the case this should
      # still create a release for.
      - name: Check if a release already exists for this version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
